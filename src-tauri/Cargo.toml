[package]
name = "db-query"
version = "0.4.0"
description = "Lightweight MySQL client"
authors = ["SparedRay"]
license = "MIT"
edition = "2021"
# Raised from 1.82 for `rmcp` (Stage 13), which declares 1.88. Both mise and CI
# build with `stable`, so this is a declaration catching up with reality rather
# than a toolchain change — but it is a real floor, so it moves with the crate
# that raised it.
rust-version = "1.88"
# Not published, and the reason it is written down: cargo-about's `private.ignore`
# keys off this. Without it, db-query appeared in its own third-party licence
# file, under a placeholder copyright, beside a preamble already saying it is MIT.
publish = false

[lib]
name = "db_query_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save dialogs. Invoked from Rust so the pick-and-read is a single
# round trip.
#
# `tauri-plugin-fs` is **linked in regardless** — it is a transitive dependency
# of this plugin (`cargo tree -i tauri-plugin-fs` confirms it). What we control
# is that we neither call it nor grant it: the capabilities file lists no `fs:`
# permission, so JavaScript cannot reach the filesystem through it, and every
# file operation we perform lives in Rust. The distinction matters for the
# licence manifest, which must list what is compiled in, not what we chose to
# call.
tauri-plugin-dialog = "2"

# Credential storage. `keyring` 4.x's default `v1` feature maps to the native
# store per platform: Windows Credential Manager, macOS Keychain, Linux Secret
# Service. 3.x was rejected deliberately — it put those backends behind opt-in
# features and fell back to a mock store that silently stored nothing.
keyring = "4"
# Best-effort scrubbing of the in-memory password. Hygiene, not a guarantee —
# see the Secret newtype's docs.
zeroize = "1"
# Streaming an unbounded export row-by-row: sqlx hands back a Stream and this
# is the `.next()` on it. Already in the tree via sqlx, so no new download.
# Licence verified 2026-09-05: MIT OR Apache-2.0.
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# sqlx 0.9 split the old `runtime-tokio-rustls` feature into separate runtime
# and TLS flags. `mysql-rsa` is required for MySQL 8.0's default
# caching_sha2_password auth over a non-TLS connection.
# native-roots (not webpki) so an internal company CA in the OS trust store works.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "mysql",
    "mysql-rsa",
    "chrono",
    "bigdecimal",
] }
tauri-plugin-updater = "2.11.0"

# The Anthropic API client. **No new crates**: reqwest is already linked via
# `tauri-plugin-updater`, and these are exactly the features that plugin asks
# for, so cargo unifies them into the build that already exists. Measured, not
# assumed — the crate count is unchanged.
#
# `rustls-no-provider` rather than `rustls` on purpose: `rustls` pulls
# `aws-lc-rs`, which is a new crypto crate *and* needs cmake and NASM to build,
# which would land on Windows CI. The updater plugin already installs rustls
# with the `ring` provider, and that is the provider this uses.
# Dynamic dispatch for the engine trait. `dyn Trait` with async methods is not
# object-safe natively, and the engine is chosen at runtime from a profile.
# Already present on Linux via keyring -> secret-service -> zbus; on Windows this
# adds one crate. It is a **proc macro**, so it runs at build time and puts zero
# bytes in the binary. MIT OR Apache-2.0, read from the vendored Cargo.toml.
async-trait = "0.1"

# Only to install the process-wide crypto provider — see `install_tls` in
# lib.rs. `reqwest` is built with `rustls-no-provider` (deliberately, to keep
# `aws-lc-rs` and its cmake/NASM build out of Windows CI), which means *somebody*
# has to choose one, and until now nobody did: the first `Client::new()` panics.
# Already linked at 0.23 via tauri-plugin-updater, so this adds no crate.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls-no-provider",
] }
# ------------------------------------------------------------ MCP (Stage 13)
#
# The official Rust MCP SDK. Apache-2.0, read from the vendored Cargo.toml
# rather than remembered. Pinned to 3.x on purpose: 2.x negotiates older
# protocol revisions, and a client speaking a newer one should fail loudly
# rather than half-work. It is also what raised `rust-version` to 1.88 above —
# 2.2.0 is what cargo silently resolves to otherwise.
#
# No `client` feature: this app hosts a server and consumes nobody's tools.
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }

# The HTTP layer under `rmcp`'s tower service. **Not new crates** — hyper,
# hyper-util, http-body-util and bytes are all already linked via reqwest; what
# these lines add is hyper's *server* half of a crate we already compile. The
# whole MCP stage costs 12 packages, and exactly one of them
# (`httpdate`, MIT OR Apache-2.0) comes from this block.
hyper = { version = "1", default-features = false, features = [
    "server",
    "http1",
] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Only for `CancellationToken`: stopping the listener has to also stop the
# connections it spawned, or "off" would mean "off for the next client".
tokio-util = "0.7"
# Tool argument schemas. `rmcp`'s `server` feature turns this on regardless;
# naming it here is what lets `#[derive(JsonSchema)]` resolve.
schemars = "1"
# The bearer token: 32 bytes from the OS entropy source, base64 for a header.
# Both already in the tree via rmcp, so neither is a download.
rand = "0.10"
base64 = "0.23"

[dev-dependencies]
# `tests/mcp_http.rs` drives the real socket the way a client would, which needs
# an app to hang the handler off. `test` is an empty feature gating tauri's mock
# runtime; it is a dev-dependency, so it reaches no shipped binary, and it adds
# no crate — this is the same `tauri` already compiled above.
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
