# What ships, and under what terms.
#
# Generates THIRD-PARTY-LICENSES.html from the *resolved dependency graph*, so
# the manifest describes the binary rather than the lockfile. Run it per target:
# the Windows build links ~24 `windows-*` crates the Linux build does not, and a
# Linux-generated file shipped inside setup.exe would be wrong rather than
# merely short.
#
#   cargo about generate --target x86_64-unknown-linux-gnu ... --fail
#
# `--fail` is not optional in CI: a crate whose licence cannot be resolved is
# exactly the case a manifest exists to cover, and a silent gap in it is worse
# than no manifest at all.

# Order is preference, not just permission. MIT first means every
# `Apache-2.0 OR MIT` crate resolves to MIT — one licence text instead of two,
# and the same choice throughout.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # File-level copyleft, and deliberately accepted. Exactly one MPL crate
    # reaches the binary — `option-ext`, via dirs -> tauri. The other four
    # (cssparser, selectors, dtoa-short, brotli) are proc-macro dependencies
    # that compile for the host and are dropped by ignore-build-dependencies
    # below. See §2 of the Stage 5 tracker for how that was established.
    "MPL-2.0",
]

# Crates whose *packaging* defeats automatic detection, with a clarification
# maintained upstream rather than guessed at here.
#
# `ring` and `rustix` are deliberately NOT here: their built-in clarifications
# are stale against the versions we link, and they fail **silently** — the
# reason is logged at `debug`, which nothing reads, and generation exits 0 with
# the bad output. ring's is written out below instead, against the files ring
# actually ships today.
#
# The full list is at
# <https://embarkstudios.github.io/cargo-about/cli/generate/workarounds.html>.
workarounds = ["chrono", "rustls", "gtk"]

# Build and dev dependencies compile for the *host* and are not linked into what
# we hand anyone, so attributing them would overstate what ships. This is the
# option that keeps the manifest honest — and it is what reduces the five MPL
# crates to the one that actually matters.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Targets are passed on the command line instead, one run per platform.
targets = []

[private]
# This crate itself is not published to crates.io and does not attribute itself.
ignore = true

# --- clarifications -----------------------------------------------------------
#
# User clarifications are applied before any scanning, so they decide rather
# than compete. Each names a file and its SHA-256: if a crate changes what it
# ships, the clarification stops applying — silently — which is why
# `scripts/attribution.mjs` checks the *output* for the defects these fix.

# ring 0.17.14 restructured its licensing: `LICENSE` is now a two-paragraph
# pointer at three other files rather than a licence. Without this the scanner
# falls back to hunting licence headers in the source and extracts whole .rs and
# .h files that merely start with the ISC header — shipping `eddsa_digest()` and
# a set of C typedefs into a document of legal notices, and counting each
# extracted file as a separate ISC entry: eighteen of them, for three crates
# that are actually ISC.
[ring.clarify]
license = "ISC AND Apache-2.0 AND MIT"
files = [
    # ring's own code.
    { path = "LICENSE-other-bits", license = "ISC", checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f" },
    # The BoringSSL-derived code. The Go and Chromium BSD-3 notices at the end of
    # this file ride along because ring ships them in it — that is ring's own
    # notice, reproduced verbatim, which is the point.
    { path = "LICENSE-BoringSSL", license = "Apache-2.0", checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d" },
    # The vendored once_cell polyfill.
    { path = "src/polyfill/once_cell/LICENSE-MIT", license = "MIT", checksum = "6ee2ed6c77710de911761acd5fc1ad1da00f476beb1a7ef27e78c2d1858deafc" },
]

# tracing-core ships exactly one LICENSE, "Copyright (c) 2019 Tokio
# Contributors". It was appearing **twice**: once correctly, and once under
# "Copyright (c) 2014 Mathijs van de Nes" — the `zip` crate's copyright, and the
# only outright false statement in the file. Pinning its own file removes it.
[tracing-core.clarify]
license = "MIT"
files = [{ path = "LICENSE", checksum = "898b1ae9821e98daf8964c8d6c7f61641f5f5aa78ad500020771c0939ee0dea1" }]

# `Apache-2.0 OR MIT`, shipping both texts separately, but rendered under an
# "MIT License" heading whose body opened with the full Apache-2.0 grant. MIT is
# the licence we take, per `accepted` above, so this names the file that says so.
[atomic-waker.clarify]
license = "MIT"
files = [{ path = "LICENSE-MIT", checksum = "23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3" }]

# --- crates whose own notice the scanner never reaches -------------------------
#
# These ship a real licence file with a real copyright line, and cargo-about
# rendered them under its *template* text — `Copyright (c) <year> <copyright
# holders>` — which retains nothing, when MIT's one substantive condition is
# that the copyright notice be retained.
#
# Two causes, both found by reading its trace:
#
#   * **The filename never reaches the scanner.** It walks with the `ignore`
#     crate's default file types, and `LICENSE_MIT` — an underscore, which is
#     how the whole Tauri family spells it — matches none of them. Tauri's
#     `LICENSE_APACHE-2.0` *is* scanned, because it ends in `.0` and so looks
#     like a man page. That is the only reason.
#   * **Confidence.** `minisign-verify`'s LICENSE scores 0.64 against a
#     threshold of 0.8 and is discarded. Lowering the threshold trades this for
#     something worse: at 0.3 the file grows by 2500 lines of source whose
#     headers now match.

[tauri.clarify]
license = "MIT"
files = [{ path = "LICENSE_MIT", checksum = "9dd42ea92cff2ede5cd477cbfcce051b2d0115c0ac7f368ee88cb545055dff1d" }]

[tauri-codegen.clarify]
license = "MIT"
files = [{ path = "LICENSE_MIT", checksum = "9dd42ea92cff2ede5cd477cbfcce051b2d0115c0ac7f368ee88cb545055dff1d" }]

