<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>db-query</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="railbar">
        <nav id="rail" class="rail" title="Connections"></nav>
        <button id="btn-theme" class="rail-theme" type="button"></button>
      </div>

      <aside id="sidebar">
        <div class="pane-head">
          <span id="conn-dot" class="conn-dot" hidden></span>
          <span id="conn-label">No connection</span>
          <button id="btn-connect" class="mini">Connect</button>
          <button id="btn-update" class="mini update" hidden></button>
        </div>
        <div id="tree" class="tree"></div>
      </aside>

      <div id="vsplit" class="splitter splitter-v" title="Drag to resize"></div>

      <main id="main">
        <section id="editor-pane">
          <div id="script-tabs" class="script-tabs"></div>
          <div class="pane-head">
            <button id="btn-run" class="mini" disabled>Run <kbd>Ctrl+Enter</kbd></button>
            <button id="btn-run-all" class="mini" disabled>Run all <kbd>Ctrl+Shift+Enter</kbd></button>
            <button id="btn-cancel" class="mini danger" hidden>Cancel</button>
            <span id="file-note" class="chip" hidden></span>
            <label class="toggle" title="Append LIMIT 5000 to unbounded SELECTs">
              <input type="checkbox" id="chk-autolimit" checked /> Auto-LIMIT
            </label>
            <label class="toggle" title="Advisory squiggles only — never blocks Run">
              <input type="checkbox" id="chk-lint" checked /> Lint
            </label>
            <label class="toggle" title="Safety net: KILL the query after N seconds. 0 = off">
              Timeout
              <input type="number" id="num-timeout" class="num" value="0" min="0" max="3600" />s
            </label>
          </div>
          <div id="editor"></div>
        </section>

        <div id="hsplit" class="splitter splitter-h" title="Drag to resize"></div>

        <section id="results-pane">
          <div id="tabs" class="tabs"></div>
          <div id="grid" class="grid-host" tabindex="0"></div>
          <div class="result-bar">
            <div id="status" class="status"></div>
            <span id="result-note" class="result-note" hidden></span>
            <div class="result-actions">
              <button id="btn-copy" title="Copy the selected columns (Ctrl+C)">Copy</button>
              <button id="btn-copy-nohead" title="Copy without the header row">Copy (no headers)</button>
              <button id="btn-export">Export…</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="export-dialog">
      <form method="dialog" id="export-form">
        <h2>Export results</h2>

        <p id="export-scope-note" class="hint"></p>

        <label>Format
          <select id="export-format">
            <option value="csv">CSV</option>
            <option value="inserts">SQL INSERT statements</option>
          </select>
        </label>

        <label>Rows
          <select id="export-scope">
            <option value="shown">The rows shown</option>
            <option value="all">Re-run the query and export every row</option>
          </select>
        </label>

        <fieldset id="export-csv-opts">
          <legend>CSV</legend>
          <div class="row">
            <label class="narrow">Delimiter <input id="csv-delim" value="," maxlength="3" /></label>
            <label class="toggle"><input type="checkbox" id="csv-headers" checked /> Header row</label>
          </div>
          <label>NULL is written as
            <input id="csv-null" placeholder="(empty)" />
          </label>
          <p class="hint">CSV cannot tell NULL from an empty string. Leave this blank and they look identical in the file.</p>
          <label class="toggle"><input type="checkbox" id="csv-crlf" checked /> CRLF line endings (Excel)</label>
          <label class="toggle"><input type="checkbox" id="csv-bom" checked /> UTF-8 BOM (Excel reads accents correctly)</label>
          <label class="toggle"><input type="checkbox" id="csv-guard" /> Defuse spreadsheet formulas</label>
          <p class="hint">Prefixes <code>'</code> to fields starting <code>=</code>, <code>+</code>, <code>-</code> or <code>@</code>. This changes the exported value, so it is off by default.</p>
        </fieldset>

        <fieldset id="export-sql-opts" hidden>
          <legend>SQL</legend>
          <label>Table name <input id="sql-table" /></label>
          <label class="toggle"><input type="checkbox" id="sql-create" /> Include CREATE TABLE</label>
          <p class="hint" id="sql-create-note"></p>
          <label class="narrow">Rows per INSERT <input id="sql-batch" type="number" value="100" min="1" /></label>
        </fieldset>

        <p id="export-error" class="error" hidden></p>

        <div class="actions">
          <button type="button" id="export-cancel">Cancel</button>
          <button type="submit" id="export-ok">Export</button>
        </div>
      </form>
    </dialog>

    <dialog id="conn-dialog">
      <form method="dialog" id="conn-form">
        <h2 id="conn-title">New connection</h2>

        <label>Name <input name="name" placeholder="local" /></label>
        <div class="swatches" id="conn-colours"></div>

        <div class="row">
          <label class="grow">Host <input name="host" value="127.0.0.1" required /></label>
          <label class="narrow">Port <input name="port" type="number" value="3306" required /></label>
        </div>
        <label>User <input name="user" value="root" required /></label>
        <label>Password <input name="password" type="password" /></label>
        <label>Database <input name="database" placeholder="(optional)" /></label>

        <label class="toggle">
          <input type="checkbox" name="allowInvalidCerts" />
          Allow invalid certificates (self-signed / internal CA)
        </label>
        <label class="toggle">
          <input type="checkbox" name="save" id="conn-save" checked />
          Save this connection
        </label>
        <label class="toggle" id="conn-remember-row">
          <input type="checkbox" name="remember" id="conn-remember" />
          Remember password in the system keychain
        </label>

        <p id="conn-error" class="error" hidden></p>
        <menu>
          <button value="cancel" type="button" id="conn-cancel">Cancel</button>
          <button value="ok" id="conn-ok">Connect</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
