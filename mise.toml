# Toolchain for this project. `mise install` provisions everything below.
#
# System libraries (webkit2gtk, libsoup, etc.) are NOT here — mise does not
# manage C dev packages. See README.md for the apt step.

[tools]
node = "24"
# mise drives rustup under the hood, so components work as normal.
rust = { version = "stable", components = "rustfmt,clippy" }

# Tasks run with mise's environment applied, so they work whether or not mise is
# activated in the calling shell. `mise run dev` is the reliable entry point.
[tasks.dev]
description = "Run the app (Tauri dev, hot reload)"
run = "npm run tauri dev"

[tasks.check]
description = "Build, lint, format and typecheck everything"
run = [
  "cargo build --manifest-path src-tauri/Cargo.toml",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --check",
  "npx tsc --noEmit",
]

[tasks.test]
description = "Offline tests: Rust unit + fixture. See test-ui for the frontend."
run = [
  "cargo test --manifest-path src-tauri/Cargo.toml --lib",
  "cargo test --manifest-path src-tauri/Cargo.toml --test sample_files",
  "cargo test --manifest-path src-tauri/Cargo.toml --test packaging",
  "cargo test --manifest-path src-tauri/Cargo.toml --test mcp_http",
  # Stage 23 §9.1/9.2/9.6 — facts about `split` on real files, which are pure
  # and so belong in the offline suite. They are measurements kept as tests:
  # if `split` ever changes its mind about a leading comment, the design that
  # was built on the answer should fail here.
  "cargo test --manifest-path src-tauri/Cargo.toml --test measure_sqlfiles",
  "node --test scripts/set-version.test.mjs",
  "node --test scripts/attribution.test.mjs",
]

[tasks.test-ui]
description = "Frontend tests: the real UI in a real browser, stubbed backend"
run = "npx playwright test --project=chromium"

[tasks.test-ui-webkit]
description = "The same suite on WebKit — the engine Tauri actually ships on Linux/macOS"
run = "npx playwright test --project=webkit"

[tasks.test-ui-all]
description = "Both engines"
run = "npx playwright test"

[tasks.test-live]
description = "Tests needing the MySQL fixture (see dev/README.md) and a keychain"
run = [
  "cargo test --manifest-path src-tauri/Cargo.toml --test live_mysql -- --ignored --test-threads=1",
  # `--skip measure`: the batch-size measurements read a million rows four
  # times and load three scripts. They are kept as tests so the numbers can be
  # reproduced, not run as part of a suite.
  "cargo test --manifest-path src-tauri/Cargo.toml --test live_export_probe -- --ignored --test-threads=1 --skip measure",
  "cargo test --manifest-path src-tauri/Cargo.toml --test keychain -- --ignored",
  # Stage 23 §9.3/9.5/9.7 — an abandoned stream, `USE` persistence and the
  # prepared-statement cache, all of which the design depends on and none of
  # which can be read off the code. `--skip csv_throughput` leaves out the one
  # that streams a million rows three times.
  "cargo test --manifest-path src-tauri/Cargo.toml --test measure_sqlfiles -- --ignored --test-threads=1 --skip csv_throughput",
]

[tasks.set-version]
description = "Set the app version everywhere (package.json, lockfile, Cargo.toml)"
run = "node scripts/set-version.mjs"

# ---------------------------------------------------------------------------
# Local fixtures. Every one of them is rootless podman, throwaway, and bound to
# localhost only — none of them is a service this project depends on.
# ---------------------------------------------------------------------------

# **Wait for the real server, not the one that is about to be shut down.**
#
# On a container's first boot the official entrypoint starts a *temporary*
# server with `--skip-networking` on the unix socket to run initialisation
# (`/usr/local/bin/docker-entrypoint.sh:124`, read from the image 2026-10-14).
# A socket ping answers there — the log says `port: 0` — so a socket check
# breaks early and whatever runs next is talking to a server that stops a
# second later. Measured on a fresh container, 2026-10-14:
#
#     48.2s  temporary server ready   port: 0      <- a socket ping answers
#     49.3s  stopping temporary server
#     51.3s  temporary server stopped
#     52.1s  real server ready        port: 3306
#
# `db-up` seeded into that ~3s window and died mid-script, which is why it
# failed on a fresh container and worked on every run after. TCP is refused
# until the real server is listening, so this cannot answer early.
#
# One definition, used by every task that needs the fixture — the same check
# was pasted into three of them.
[tasks.db-wait]
description = "Wait until the MySQL fixture's real server answers, not the init one"
run = """
# "Not there" and "not ready yet" are different answers and get different
# ones back. Waiting 180s for a container nobody started would be the slowest
# possible way to say `mise run db-up`.
if ! podman container exists db-query-mysql; then
  echo "The MySQL fixture is not there. Run: mise run db-up" >&2
  exit 1
fi
i=0
while [ "$i" -lt 90 ]; do
  if podman exec db-query-mysql mysqladmin ping -h 127.0.0.1 -P 3306 \
       -uroot -pdevpassword --silent >/dev/null 2>&1; then
    exit 0
  fi
  if [ "$i" = 2 ]; then echo "waiting for MySQL to finish starting…"; fi
  i=$((i + 1))
  sleep 2
done
echo "MySQL did not answer in 180s. Try: podman logs db-query-mysql" >&2
exit 1
"""

[tasks.db-up]
description = "Start the MySQL 8 fixture container and seed it"
run = """
set -e
# **Not `--replace`.** That would delete the container, and with it
# `export_probe` and the `flyway_*` databases that other fixtures put there.
# An existing fixture is started, not rebuilt. Asking first also keeps the
# "name already in use" error off the screen on every run after the first,
# which read as a failure when the task had in fact succeeded.
if podman container exists db-query-mysql; then
  podman start db-query-mysql >/dev/null
else
  podman run -d --name db-query-mysql -e MYSQL_ROOT_PASSWORD=devpassword \
    -p 3306:3306 docker.io/library/mysql:8 >/dev/null
fi
mise run db-wait
podman exec -i db-query-mysql mysql -uroot -pdevpassword < dev/seed.sql
echo "fixture ready on 127.0.0.1:3306 (root / devpassword, database poc)"
"""

[tasks.export-probe-up]
description = "Build the export_probe database (Stage 22: views on views, trigger order, 1M rows)"
depends = ["db-wait"]
run = """
set -e
podman exec -i db-query-mysql mysql -uroot -pdevpassword < dev/export-probe.sql
echo "export_probe ready (1,000,000 rows in wide)"
"""

[tasks.db-down]
description = "Stop and remove the MySQL fixture container"
run = "podman stop db-query-mysql && podman rm db-query-mysql"

# The seed deletes `orders` before rebuilding it, and gives every document an
# explicit `_id`. Both matter: `{"index":{}}` mints a new id per run, so the
# original seed *appended* three more documents each time it was run and the
# live tests started failing on `rows.len() == 3`. A fixture that is not
# idempotent is a fixture that lies the second time you use it.
[tasks.es-up]
description = "Start an Elasticsearch fixture (security off) and re-seed an index"
run = """
podman run -d --name db-query-es \
  -e discovery.type=single-node \
  -e xpack.security.enabled=false \
  -e ES_JAVA_OPTS='-Xms512m -Xmx512m' \
  -p 9200:9200 docker.elastic.co/elasticsearch/elasticsearch:8.15.0 \
  || podman start db-query-es
until curl -sf http://localhost:9200 >/dev/null 2>&1; do sleep 2; done
curl -s -X DELETE http://localhost:9200/orders >/dev/null
curl -sf -X PUT http://localhost:9200/orders -H 'content-type: application/json' -d '{
  "mappings": {"properties": {
    "user": {"type": "keyword"},
    "total": {"type": "double"},
    "created_at": {"type": "date"}
  }}
}' >/dev/null || true
curl -sf -X POST http://localhost:9200/orders/_bulk -H 'content-type: application/x-ndjson' --data-binary '
{"index":{"_id":"1"}}
{"user":"ada","total":120.5,"created_at":"2026-01-02T00:00:00Z"}
{"index":{"_id":"2"}}
{"user":"grace","total":80.0,"created_at":"2026-01-03T00:00:00Z"}
{"index":{"_id":"3"}}
{"user":"ada","total":15.25,"created_at":"2026-01-04T00:00:00Z"}
' >/dev/null
curl -sf -X POST http://localhost:9200/orders/_refresh >/dev/null
echo "elasticsearch ready on http://localhost:9200 (index: orders, 3 docs)"
"""

[tasks.es-down]
description = "Stop and remove the Elasticsearch fixture"
run = "podman stop db-query-es && podman rm db-query-es"

# Flyway is **not** run in a container, deliberately. The app invokes the user's
# own CLI with its working directory set to the project folder, because that is
# how a relative `locations` resolves. In a container the paths are mounts, the
# working directory is the container's and the database host is not the one the
# TOML names — every part of that would be replaced by something the app never
# does. See §7 of the Stage 15 tracker.
#
# The version is pinned to the one Flyway Desktop ships (13.5.0; Desktop calls
# its build 13.5.0-rc2720). The download is ~584MB because it carries its own
# JRE, which is what makes it a one-command fixture rather than "install Java
# first".
[tasks.flyway-up]
description = "Fetch the pinned Flyway CLI and prepare the migration fixture databases"
# Before the 584MB download rather than after it: without a fixture this used
# to spend the download and then wait forever for a server nobody had started.
depends = ["db-wait"]
run = """
set -e
VERSION=13.5.0
DEST=dev/.flyway
BIN="$DEST/flyway-$VERSION/flyway"

if [ ! -x "$BIN" ]; then
  mkdir -p "$DEST"
  TAR="$DEST/flyway-$VERSION.tar.gz"
  BASE=https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/$VERSION
  echo "Downloading Flyway $VERSION (~584MB, includes its own JRE)…"
  curl -fL --progress-bar -o "$TAR" "$BASE/flyway-commandline-$VERSION-linux-x64.tar.gz"
  # Verified, not trusted: a truncated download would otherwise show up much
  # later as an unreadable archive or a mysteriously missing driver.
  WANT=$(curl -fsSL "$BASE/flyway-commandline-$VERSION-linux-x64.tar.gz.sha1")
  GOT=$(sha1sum "$TAR" | cut -d' ' -f1)
  [ "$WANT" = "$GOT" ] || { echo "sha1 mismatch: wanted $WANT, got $GOT"; exit 1; }
  tar -xzf "$TAR" -C "$DEST"
  rm -f "$TAR"
fi

# The two databases the fixture's environments point at. `db-up` owns the
# server; these are this fixture's own, so the two do not tread on each other.
podman exec -i db-query-mysql mysql -uroot -pdevpassword -e \
  "DROP DATABASE IF EXISTS flyway_dev; DROP DATABASE IF EXISTS flyway_qa; \
   DROP DATABASE IF EXISTS flyway_probe; \
   CREATE DATABASE flyway_dev; CREATE DATABASE flyway_qa; CREATE DATABASE flyway_probe;"

"$BIN" --version >/dev/null 2>&1 || { echo "the downloaded flyway will not run"; exit 1; }
echo "flyway $VERSION ready at $BIN"
echo "project: dev/flyway/flyway.toml (environments: development, qa, probe; tests clean probe)"
"""

[tasks.flyway-down]
description = "Drop the migration fixture databases (leaves the downloaded CLI)"
run = """
podman exec -i db-query-mysql mysql -uroot -pdevpassword -e \
  "DROP DATABASE IF EXISTS flyway_dev; DROP DATABASE IF EXISTS flyway_qa; \
   DROP DATABASE IF EXISTS flyway_probe;"
"""

[tasks.test-flyway]
description = "Tests needing the Flyway CLI and fixture (see flyway-up)"
run = "cargo test --manifest-path src-tauri/Cargo.toml --test live_flyway -- --ignored --test-threads=1"

[tasks.test-es]
description = "Tests needing the Elasticsearch fixture (see es-up)"
run = "cargo test --manifest-path src-tauri/Cargo.toml --test live_elastic -- --ignored --test-threads=1"

# The model is small on purpose: it runs on CPU in a couple of GB, and the
# point of the fixture is to prove the OpenAI-compatible adapter is real, not
# to get good SQL. Override with OLLAMA_MODEL for anything else.
#
# Licences, both checked at source: Ollama is MIT, Qwen2.5-Coder is Apache-2.0.
[tasks.ollama-up]
description = "Start a local Ollama fixture and pull a small model"
run = """
model="${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"
podman run -d --name db-query-ollama \
  -v db-query-ollama:/root/.ollama \
  -p 11434:11434 docker.io/ollama/ollama:latest \
  || podman start db-query-ollama
until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done
podman exec db-query-ollama ollama pull "$model"
echo "ollama ready on http://localhost:11434 (model: $model)"
echo "In Settings choose the Ollama preset and enter that model name. No key needed."
"""

# The pulled model lives in a named volume, so bringing the fixture back up
# does not re-download it. `podman volume rm db-query-ollama` reclaims the disk.
[tasks.ollama-down]
description = "Stop and remove the Ollama fixture (the model volume survives)"
run = "podman stop db-query-ollama && podman rm db-query-ollama"

# `--exact`, and the count checked afterwards, because `cargo test` exits 0 when
# a filter matches nothing. A misspelled filter otherwise reports a green run
# that contacted no server at all — which is what the first version of this task
# did, silently, for one run.
# Needs a CLI installed *and* signed in. The readiness test is free; the other
# three each spend one request on the person's own subscription, which is why
# this is a task they run rather than part of `check`. `CLI_RECIPE=claude`
# switches which CLI is exercised.
# Cargo never prunes `target/`: every dependency version and every test binary
# you have ever built stays there. Measured 2026-10-01 on this machine —
# `target/debug` had reached **97 GB**, of which a complete rebuild needed
# **3.2 GB**, in 82 seconds. So this is cheap, and worth running whenever disk
# gets tight rather than once it is full (a full disk fails the *linker*, which
# reports it as a mysterious `cc` error).
#
# `release/` and the Windows cross-build are left alone: they are small, and a
# release rebuild is slow (`lto`, `codegen-units = 1`).
[tasks.clean]
description = "Reclaim the debug build tree (keeps release)"
run = """
before=$(du -sh src-tauri/target 2>/dev/null | cut -f1)
rm -rf src-tauri/target/debug
echo "target/ was $before, now $(du -sh src-tauri/target 2>/dev/null | cut -f1); next build is a full one"
df -h . | tail -1
"""

[tasks.test-cli]
description = "The agent-CLI provider, against a real Copilot or Claude CLI"
run = """
cargo test --manifest-path src-tauri/Cargo.toml --test agentcli_live \
  -- --ignored --test-threads=1 --nocapture | tee /tmp/db-query-cli-test.log
grep -q "4 passed" /tmp/db-query-cli-test.log || { echo "not all four ran — is the CLI signed in?"; exit 1; }
"""

[tasks.test-ollama]
description = "The assistant's local-endpoint test, against the ollama-up fixture"
run = """
model="${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"
OLLAMA_MODEL="$model" cargo test --manifest-path src-tauri/Cargo.toml \
  --test assistant_live -- --ignored --exact --nocapture \
  a_local_openai_compatible_server_streams_back | tee /tmp/db-query-ollama-test.log
grep -q "1 passed" /tmp/db-query-ollama-test.log || { echo "no passing test — is 'mise run ollama-up' running?"; exit 1; }
"""
