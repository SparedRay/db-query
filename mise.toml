# Toolchain for this project. `mise install` provisions everything below.
#
# System libraries (webkit2gtk, libsoup, etc.) are NOT here — mise does not
# manage C dev packages. See README.md for the apt step.

[tools]
node = "24"
# mise drives rustup under the hood, so components work as normal.
rust = { version = "stable", components = "rustfmt,clippy" }

# Tasks run with mise's environment applied, so they work whether or not mise is
# activated in the calling shell. `mise run dev` is the reliable entry point.
[tasks.dev]
description = "Run the app (Tauri dev, hot reload)"
run = "npm run tauri dev"

[tasks.check]
description = "Build, lint, format and typecheck everything"
run = [
  "cargo build --manifest-path src-tauri/Cargo.toml",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --check",
  "npx tsc --noEmit",
]

[tasks.test]
description = "Offline tests: Rust unit + fixture. See test-ui for the frontend."
run = [
  "cargo test --manifest-path src-tauri/Cargo.toml --lib",
  "cargo test --manifest-path src-tauri/Cargo.toml --test sample_files",
  "cargo test --manifest-path src-tauri/Cargo.toml --test packaging",
]

[tasks.test-ui]
description = "Frontend tests: the real UI in a real browser, stubbed backend"
run = "npx playwright test --project=chromium"

[tasks.test-ui-webkit]
description = "The same suite on WebKit — the engine Tauri actually ships on Linux/macOS"
run = "npx playwright test --project=webkit"

[tasks.test-ui-all]
description = "Both engines"
run = "npx playwright test"

[tasks.test-live]
description = "Tests needing the MySQL fixture (see dev/README.md) and a keychain"
run = [
  "cargo test --manifest-path src-tauri/Cargo.toml --test live_mysql -- --ignored --test-threads=1",
  "cargo test --manifest-path src-tauri/Cargo.toml --test keychain -- --ignored",
]

[tasks.set-version]
description = "Set the app version everywhere (package.json, lockfile, Cargo.toml)"
run = "node scripts/set-version.mjs"

# ---------------------------------------------------------------------------
# Local fixtures. Every one of them is rootless podman, throwaway, and bound to
# localhost only — none of them is a service this project depends on.
# ---------------------------------------------------------------------------

[tasks.db-up]
description = "Start the MySQL 8 fixture container and seed it"
run = """
podman run -d --name db-query-mysql -e MYSQL_ROOT_PASSWORD=devpassword -p 3306:3306 docker.io/library/mysql:8 || podman start db-query-mysql
until podman exec db-query-mysql mysqladmin ping -uroot -pdevpassword --silent 2>/dev/null; do sleep 2; done
podman exec -i db-query-mysql mysql -uroot -pdevpassword < dev/seed.sql
echo "fixture ready on 127.0.0.1:3306 (root / devpassword, database poc)"
"""

[tasks.db-down]
description = "Stop and remove the MySQL fixture container"
run = "podman stop db-query-mysql && podman rm db-query-mysql"

# The seed deletes `orders` before rebuilding it, and gives every document an
# explicit `_id`. Both matter: `{"index":{}}` mints a new id per run, so the
# original seed *appended* three more documents each time it was run and the
# live tests started failing on `rows.len() == 3`. A fixture that is not
# idempotent is a fixture that lies the second time you use it.
[tasks.es-up]
description = "Start an Elasticsearch fixture (security off) and re-seed an index"
run = """
podman run -d --name db-query-es \
  -e discovery.type=single-node \
  -e xpack.security.enabled=false \
  -e ES_JAVA_OPTS='-Xms512m -Xmx512m' \
  -p 9200:9200 docker.elastic.co/elasticsearch/elasticsearch:8.15.0 \
  || podman start db-query-es
until curl -sf http://localhost:9200 >/dev/null 2>&1; do sleep 2; done
curl -s -X DELETE http://localhost:9200/orders >/dev/null
curl -sf -X PUT http://localhost:9200/orders -H 'content-type: application/json' -d '{
  "mappings": {"properties": {
    "user": {"type": "keyword"},
    "total": {"type": "double"},
    "created_at": {"type": "date"}
  }}
}' >/dev/null || true
curl -sf -X POST http://localhost:9200/orders/_bulk -H 'content-type: application/x-ndjson' --data-binary '
{"index":{"_id":"1"}}
{"user":"ada","total":120.5,"created_at":"2026-01-02T00:00:00Z"}
{"index":{"_id":"2"}}
{"user":"grace","total":80.0,"created_at":"2026-01-03T00:00:00Z"}
{"index":{"_id":"3"}}
{"user":"ada","total":15.25,"created_at":"2026-01-04T00:00:00Z"}
' >/dev/null
curl -sf -X POST http://localhost:9200/orders/_refresh >/dev/null
echo "elasticsearch ready on http://localhost:9200 (index: orders, 3 docs)"
"""

[tasks.es-down]
description = "Stop and remove the Elasticsearch fixture"
run = "podman stop db-query-es && podman rm db-query-es"

[tasks.test-es]
description = "Tests needing the Elasticsearch fixture (see es-up)"
run = "cargo test --manifest-path src-tauri/Cargo.toml --test live_elastic -- --ignored --test-threads=1"

# The model is small on purpose: it runs on CPU in a couple of GB, and the
# point of the fixture is to prove the OpenAI-compatible adapter is real, not
# to get good SQL. Override with OLLAMA_MODEL for anything else.
#
# Licences, both checked at source: Ollama is MIT, Qwen2.5-Coder is Apache-2.0.
[tasks.ollama-up]
description = "Start a local Ollama fixture and pull a small model"
run = """
model="${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"
podman run -d --name db-query-ollama \
  -v db-query-ollama:/root/.ollama \
  -p 11434:11434 docker.io/ollama/ollama:latest \
  || podman start db-query-ollama
until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done
podman exec db-query-ollama ollama pull "$model"
echo "ollama ready on http://localhost:11434 (model: $model)"
echo "In Settings choose the Ollama preset and enter that model name. No key needed."
"""

# The pulled model lives in a named volume, so bringing the fixture back up
# does not re-download it. `podman volume rm db-query-ollama` reclaims the disk.
[tasks.ollama-down]
description = "Stop and remove the Ollama fixture (the model volume survives)"
run = "podman stop db-query-ollama && podman rm db-query-ollama"

# `--exact`, and the count checked afterwards, because `cargo test` exits 0 when
# a filter matches nothing. A misspelled filter otherwise reports a green run
# that contacted no server at all — which is what the first version of this task
# did, silently, for one run.
[tasks.test-ollama]
description = "The assistant's local-endpoint test, against the ollama-up fixture"
run = """
model="${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"
OLLAMA_MODEL="$model" cargo test --manifest-path src-tauri/Cargo.toml \
  --test assistant_live -- --ignored --exact --nocapture \
  a_local_openai_compatible_server_streams_back | tee /tmp/db-query-ollama-test.log
grep -q "1 passed" /tmp/db-query-ollama-test.log || { echo "no passing test — is 'mise run ollama-up' running?"; exit 1; }
"""
