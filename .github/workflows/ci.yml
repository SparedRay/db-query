# Every push and pull request, on both platforms we ship to.
#
# Toolchain versions are pinned in mise.toml for local work; they are repeated
# here rather than driven by mise, because mise on the Windows runner is the
# less-travelled path and a broken toolchain step would hide real failures.
# If you bump mise.toml, bump this too.

name: CI

on:
  push:
    branches: [main]
    # Tags too, so a release build never happens without the full suite having
    # run against exactly that commit. Note it runs *alongside* release.yml
    # rather than gating it — a red CI run on a tag means pull the draft
    # release, it does not stop it being built.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — check, unit, live MySQL, UI (both engines)
    runs-on: ubuntu-latest

    # The live suite talks to a real server. The credentials match dev/seed.sql
    # and the podman fixture in dev/README.md, so the same tests run unchanged
    # here and on a developer machine.
    services:
      # A second engine gets a second fixture. Stage 11's whole risk is breaking
      # MySQL quietly while adding Elasticsearch, so both run on every push.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: devpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pdevpassword --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      # Tauri links webkit2gtk natively, so even the pure-Rust tests cannot
      # compile without these. Mirrors the apt step in README.md.
      - name: System libraries
        run: |
          # `apt-get update` fails the whole step if *any* configured repository
          # is unhappy, including ones this build never installs from. Google's
          # Chrome repo republished its index while we were fetching it, and the
          # resulting hash-sum mismatch failed the Linux build.
          #
          # Third-party sources are matched by **content, not by filename**. The
          # first attempt at this removed `google-chrome.list`, which is the
          # 22.04 spelling; on 24.04 the same repository is
          # `google-chrome.sources` in deb822 format, so nothing was removed and
          # the build failed again in exactly the same way.
          #
          # This also covers the browser step further down: `playwright install
          # --with-deps` runs its own `apt-get update`, which would hit the same
          # repository, and a flag on the command below would not reach it.
          for f in /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            if grep -qE 'dl\.google\.com|packages\.microsoft\.com' "$f"; then
              echo "Dropping third-party apt source: $f"
              sudo rm -f "$f"
            fi
          done
          # Everything installed below comes from Ubuntu's own archive, and the
          # runner image ships with its indexes already populated. So if the
          # update still reports a problem, say so and let `apt-get install` be
          # the gate — it is the step that actually has to succeed.
          sudo apt-get update -o Acquire::Retries=3 \
            || echo "::warning::apt-get update reported an error; continuing, the install below is the real gate."
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            mysql-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # MUST come before any cargo step. `generate_context!()` reads
      # tauri.conf.json at compile time and hard-fails if `frontendDist`
      # (../dist) is missing — and dist/ is gitignored, so a fresh checkout has
      # none. Locally this is invisible: `tauri build` runs it as
      # `beforeBuildCommand`, but a plain `cargo build` or `cargo test` does
      # not. This is what broke the first CI run on both platforms.
      # `npm run build` is `tsc --noEmit && vite build`, so it typechecks too.
      - name: Build frontend (also typechecks)
        run: npm run build

      # Attribution was deferred through two whole stages because nothing ever
      # failed without it. Generating it here — on both platforms, per target —
      # is what turns "we should ship the notices" into something that breaks
      # when it stops being true. `--fail` inside the generator means a crate
      # whose licence cannot be resolved stops the build.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party licences
        run: npm run attribution

      # --- the rest of `mise run check` ---
      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # --- `mise run test` ---
      # `npm version` writes the version into Cargo.toml and nothing into
      # Cargo.lock, which records it too — so the tagged commit carried a
      # lockfile a release behind, and `cargo build --locked` (what packagers
      # and `cargo install` use) refuses that outright.
      #
      # Checked here rather than as a Rust test, because a Rust test cannot see
      # it: `cargo test` regenerates the lockfile before the test runs, quietly
      # repairing the drift it was meant to catch. The build above has already
      # done the same — so the question worth asking is whether that *changed*
      # anything.
      - name: The committed lockfile is the one a build produces
        run: git diff --exit-code src-tauri/Cargo.lock

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Sample-file fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --test sample_files
      - name: Packaging invariants (version source, updater endpoint)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test packaging
      # Binds port 0 on loopback; no database, no keychain, no network. It is
      # the only proof that the MCP server's "off" switch actually closes the
      # port, which is not a property any amount of reading establishes.
      - name: MCP server over a real socket
        run: cargo test --manifest-path src-tauri/Cargo.toml --test mcp_http

      # The release stamps the version on both platforms, so this runs on both.
      # It is the step that failed v0.3.4 — after the tag had been pushed, which
      # is the worst place to learn that a script has a bug.
      - name: Release version stamping
        run: node --test scripts/set-version.test.mjs

      # The checks that decide whether a licence file is fit to ship. Every case
      # is a defect that was in a published one and failed nothing.
      - name: Licence manifest checks
        run: node --test scripts/attribution.test.mjs

      # --- the live suite: the half of `mise run test-live` that can run here ---
      # The keychain half cannot: a Linux runner has no D-Bus secret service.
      # It runs on Windows instead, which is what finally answers E0/C3w.
      - name: Seed the fixture
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pdevpassword < dev/seed.sql
      - name: Seed the Elasticsearch fixture
        run: |
          curl -sf -X PUT http://localhost:9200/orders -H 'content-type: application/json' -d '{
            "mappings": {"properties": {
              "user": {"type": "keyword"},
              "total": {"type": "double"},
              "created_at": {"type": "date"}
            }}
          }'
          curl -sf -X POST http://localhost:9200/orders/_bulk \
            -H 'content-type: application/x-ndjson' --data-binary '
          {"index":{}}
          {"user":"ada","total":120.5,"created_at":"2026-01-02T00:00:00Z"}
          {"index":{}}
          {"user":"grace","total":80.0,"created_at":"2026-01-03T00:00:00Z"}
          {"index":{}}
          {"user":"ada","total":15.25,"created_at":"2026-01-04T00:00:00Z"}
          '
          curl -sf -X POST http://localhost:9200/orders/_refresh

      - name: Live Elasticsearch tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test live_elastic -- --ignored --test-threads=1

      - name: Live MySQL tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test live_mysql -- --ignored --test-threads=1

      # --- `mise run test-ui-all` ---
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: UI tests — Chromium and WebKit
        run: npx playwright test

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  windows:
    name: Windows — check, unit, keychain (E0/C3w), UI
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # See the Linux job: dist/ must exist before cargo compiles anything.
      - name: Build frontend (also typechecks)
        run: npm run build

      # Attribution was deferred through two whole stages because nothing ever
      # failed without it. Generating it here — on both platforms, per target —
      # is what turns "we should ship the notices" into something that breaks
      # when it stops being true. `--fail` inside the generator means a crate
      # whose licence cannot be resolved stops the build.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party licences
        run: npm run attribution

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `npm version` writes the version into Cargo.toml and nothing into
      # Cargo.lock, which records it too — so the tagged commit carried a
      # lockfile a release behind, and `cargo build --locked` (what packagers
      # and `cargo install` use) refuses that outright.
      #
      # Checked here rather than as a Rust test, because a Rust test cannot see
      # it: `cargo test` regenerates the lockfile before the test runs, quietly
      # repairing the drift it was meant to catch. The build above has already
      # done the same — so the question worth asking is whether that *changed*
      # anything.
      - name: The committed lockfile is the one a build produces
        run: git diff --exit-code src-tauri/Cargo.lock

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Sample-file fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --test sample_files
      - name: Packaging invariants (version source, updater endpoint)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test packaging
      # Binds port 0 on loopback; no database, no keychain, no network. It is
      # the only proof that the MCP server's "off" switch actually closes the
      # port, which is not a property any amount of reading establishes.
      - name: MCP server over a real socket
        run: cargo test --manifest-path src-tauri/Cargo.toml --test mcp_http

      # The release stamps the version on both platforms, so this runs on both.
      # It is the step that failed v0.3.4 — after the tag had been pushed, which
      # is the worst place to learn that a script has a bug.
      - name: Release version stamping
        run: node --test scripts/set-version.test.mjs

      # The checks that decide whether a licence file is fit to ship. Every case
      # is a defect that was in a published one and failed nothing.
      - name: Licence manifest checks
        run: node --test scripts/attribution.test.mjs

      # E0 / C3w, carried since Stage 2 and unanswerable until now: does the
      # keychain layer actually work against Windows Credential Manager?
      # A failure here is a result, not an accident — it is the thing we came for.
      - name: Keychain — Windows Credential Manager
        run: cargo test --manifest-path src-tauri/Cargo.toml --test keychain -- --ignored

      # Chromium only. Tauri renders through WebView2 on Windows, which is
      # Chromium; Playwright's WebKit is not the engine that ships here.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        # No --with-deps: it installs Linux OS packages and has no job here.
        run: npx playwright install chromium
      - name: UI tests — Chromium
        run: npx playwright test --project=chromium

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 14
