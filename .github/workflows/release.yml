# Push a tag, get installers.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# **The version comes from the tag.** CI stamps it into `package.json` (which
# `tauri.conf.json` reads) and `Cargo.toml` before building, so the installers
# and `latest.json` all call themselves what the tag says. Nothing needs to be
# committed first.
#
# If you would rather the tagged commit also carry the number — so that
# `git checkout v0.1.1 && cargo build` produces the same version — run
# `mise run set-version 0.1.1` and commit before tagging. CI then stamps the
# same value and changes nothing.
#
# Produces a DRAFT release so the notes can be edited before anyone sees it.
# Publish it from the GitHub UI when you are happy.
#
# **To test this workflow without releasing anything**: run it manually from the
# Actions tab and leave the tag input EMPTY. It builds both installers from the
# current branch and uploads them as artefacts, publishing nothing. Use that
# rather than cutting a throwaway tag — the tag is the thing you cannot undo
# cleanly once anyone has fetched it.
#
# Note the manual run needs a tag that ALREADY EXISTS. This workflow does not
# create tags: a release must be reproducible from a commit someone can check
# out, and a tag invented by CI is not.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.1). LEAVE EMPTY for a dry run: builds both installers from this branch and publishes nothing."
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 deliberately: its glibc is 2.35, so the .deb also
          # runs on 22.04-era distributions. Building on 24.04 would produce a
          # package that requires glibc 2.39 and refuses to install on older
          # machines. If this runner image is ever retired, moving to
          # ubuntu-latest is a one-line change that narrows compatibility.
          - platform: ubuntu-22.04
            name: Linux (.deb)
          - platform: windows-latest
            name: Windows (setup.exe)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      # Before checkout, because checkout is what fails on a missing tag — with
      # a bare "the process '/usr/bin/git' failed with exit code 1" and nothing
      # to act on. This says what is actually wrong.
      - name: Check the tag exists
        if: github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ github.event.inputs.tag }}'
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1 && exit 0
          echo "::error::Tag '$tag' does not exist in this repository. Create it first:"
          echo "::error::  git tag $tag && git push origin $tag"
          echo "::error::Or re-run this workflow with the tag input empty for a dry run."
          exit 1

      # Is this a real release, or a dry run?
      #
      # A tag push is always a release. A manual run is a release only if it
      # names a tag; with the input empty it builds the current branch and
      # publishes nothing. That matters because until now the only way to test
      # this workflow was to cut a real release — which is how it first shipped
      # broken.
      - name: Decide what this run is
        id: mode
        shell: bash
        run: |
          tag='${{ github.event.inputs.tag }}'
          if [ -z "$tag" ] && [ '${{ github.event_name }}' = 'push' ]; then
            tag='${{ github.ref_name }}'
          fi
          if [ -n "$tag" ]; then
            echo "tag=$tag"     >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release build for $tag"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: installers are uploaded as artefacts, nothing is published"
          fi

      # An empty `ref` means "whatever triggered this run", which is right for
      # both a tag push and a dry run from a branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: System libraries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # `apt-get update` fails the whole step if *any* configured repository
          # is unhappy, including ones this build never installs from. The
          # runner image configures Google's Chrome repo, and on 2026-09-09 its
          # index was being republished while we fetched it — a hash-sum
          # mismatch on a repo we do not read failed the Linux build.
          #
          # Everything below comes from Ubuntu's own archive, so the third-party
          # lists are dropped first. `rm -f` on names that may not be there is
          # deliberate: this must not become a second thing that can fail.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # For the transient kind, which retrying does fix.
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The number the build calls itself used to come from a file nobody
      # touched when tagging. `v0.2.0` therefore shipped a build named 0.1.0 —
      # and because `latest.json` takes its version from the build rather than
      # from the tag, every install was told it was already current. The updater
      # was working the whole time; it was being handed the wrong number.
      #
      # After `npm ci` on purpose: the install runs against the lockfile as
      # committed, and only then does the version move.
      # `beforeBuildCommand` generates the licence notices for whichever platform
      # is building, so every bundle carries them. Without this the build fails
      # rather than silently shipping without notices — which is the point.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Stamp the version from the tag
        if: steps.mode.outputs.publish == 'true'
        run: node scripts/set-version.mjs "${{ steps.mode.outputs.tag }}"

      # Without the key, Windows builds no `latest.json` and the release ships
      # with nothing for the updater to read — while the Linux job succeeds and
      # the draft looks almost right. Better to refuse the release than to
      # publish one that silently cannot be updated from.
      - name: The updater signing key must exist
        if: steps.mode.outputs.publish == 'true'
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in this repository's secrets."
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::The value is the private key generated by 'tauri signer generate'."
            echo "::error::Without it the release carries no latest.json and no install can update itself."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        if: steps.mode.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Checked for above, because an empty value here fails late and
          # confusingly: the Linux job succeeds, the Windows one does not, and
          # the draft that results looks nearly complete.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Writes latest.json — the manifest the updater reads — alongside the
          # installers, signed with TAURI_SIGNING_PRIVATE_KEY.
          includeUpdaterJson: true
          tagName: ${{ steps.mode.outputs.tag }}
          releaseName: db-query ${{ steps.mode.outputs.tag }}
          releaseDraft: true
          prerelease: false
          # Which formats each platform emits is decided by tauri.conf.json
          # (deb) and tauri.windows.conf.json (nsis), not repeated here.
          releaseBody: |
            ## Install

            **Windows** — download `db-query_*_x64-setup.exe` and run it.
            Installs for the current user, so there is no Administrator prompt,
            and it appears in the Start Menu.

            **Linux (Debian/Ubuntu/Pop!_OS)** — download the `.deb` and:

            ```
            sudo apt install ./db-query_*_amd64.deb
            ```

            ### Updates

            Windows installs check for updates on launch and offer them; you
            choose whether to install. Linux `.deb` installs do not self-update
            — download the newer `.deb` from this page.

            **The updater only sees *published* releases**, not drafts.

            ### These builds are not code-signed

            Windows SmartScreen will say *"Windows protected your PC"* the first
            time. **More info → Run anyway.** Once, on first install.

            This is a deliberate trade: a code-signing certificate costs several
            hundred dollars a year and requires identity verification, which is
            hard to justify for an open-source tool at this stage. The source
            for every release is in this repository, and the workflow that built
            it is `.github/workflows/release.yml`.

      # --- dry run: build the same installers, publish nothing ---
      - name: Build installers (dry run)
        if: steps.mode.outputs.publish != 'true'
        run: npm run tauri build

      - name: Upload installers (dry run)
        if: steps.mode.outputs.publish != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*-setup.exe
